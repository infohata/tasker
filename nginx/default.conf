upstream tasker_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 16M;

    location /static/ {
        alias /srv/static/;
        autoindex off;
        # No `always` — keep Cache-Control off 404s so missing files
        # aren't cached by shared proxies.
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /media/ {
        alias /srv/media/;
        autoindex off;
        # User uploads are PUBLICLY ACCESSIBLE at this stage — there's
        # no authentication on /media/. `private` is a caching directive
        # only (tells shared proxies not to cache the response); it does
        # NOT restrict who can request the file. A future IDEA will add
        # an access-control layer (e.g. X-Accel-Redirect) when uploads
        # land.
        add_header Cache-Control "private, max-age=86400";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://tasker_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }
}
